name: Fix notebook math rendering

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-math:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Normalize Jupyter math delimiters
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          changed_files = []
          for path in sorted(Path('notebooks').glob('*.ipynb')):
              nb = json.loads(path.read_text(encoding='utf-8'))
              changed = False
              for cell in nb.get('cells', []):
                  if cell.get('cell_type') != 'markdown':
                      continue
                  src = ''.join(cell.get('source', []))
                  new = src.replace(r'\[', '$$').replace(r'\]', '$$').replace(r'\(', '$').replace(r'\)', '$')
                  if new != src:
                      cell['source'] = new.splitlines(keepends=True)
                      changed = True
              if changed:
                  path.write_text(json.dumps(nb, ensure_ascii=False, indent=1) + '\n', encoding='utf-8')
                  changed_files.append(str(path))
          print('Updated:', changed_files if changed_files else 'nothing')
          PY
      - name: Commit corrected notebooks
        run: |
          if git diff --quiet -- notebooks; then
            echo "No notebook math changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add notebooks
          git commit -m "Fix notebook math rendering"
          git push origin main
